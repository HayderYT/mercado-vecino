name: mercado-vecino

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercado
      POSTGRES_USER: mercado_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado_app -d mercado"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass $$(cat /run/secrets/redis_password)"]
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: runtime
    image: mercado-api:1.0
    environment:
      DB_HOST: db
      DB_NAME: mercado
      DB_USER: mercado_app
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: cache
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - db_password
      - redis_password
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./frontend
    image: mercado-web:1.0
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
